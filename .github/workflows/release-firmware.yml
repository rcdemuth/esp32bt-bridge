name: Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ESP32 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version and Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.1.0"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

          # Extract numerical version components (e.g. v1.2 -> MAJOR=1, MINOR=2)
          CLEAN_VER="${TAG#v}"
          MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-1}
          echo "FIRMWARE_VERSION_MAJOR=$MAJOR" >> $GITHUB_ENV
          echo "FIRMWARE_VERSION_MINOR=$MINOR" >> $GITHUB_ENV
          echo "Building firmware for version $MAJOR.$MINOR with tag $TAG"

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize Arduino CLI configuration
        run: |
          arduino-cli config init --additional-urls "https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"
          arduino-cli core update-index

      - name: Install ESP32 Platform Core
        run: |
          arduino-cli core install esp32:esp32@2.0.11

      - name: Install Required Arduino Libraries
        run: |
          arduino-cli lib install JC_Button@2.1.2
          arduino-cli lib install ESP32_BleSerial@1.0.4
          arduino-cli lib install "ESP32-OTA-Pull"@1.0.0

      - name: Copy Custom Partition Table
        run: |
          cp Firmware/BlueSMiRF_Partitions.csv /home/runner/.arduino15/packages/esp32/hardware/esp32/2.0.11/tools/partitions/BlueSMiRF_Partitions.csv

      - name: Compile Firmware Sketch
        run: |
          arduino-cli compile --fqbn "esp32:esp32:esp32:DebugLevel=none,PSRAM=enabled" ./Firmware/BlueSMiRF-v2/BlueSMiRF-v2.ino \
            --build-property build.partitions=BlueSMiRF_Partitions \
            --build-property upload.maximum_size=3145728 \
            --build-property "compiler.cpp.extra_flags=\"-DFIRMWARE_VERSION_MAJOR=${FIRMWARE_VERSION_MAJOR}\" \"-DFIRMWARE_VERSION_MINOR=${FIRMWARE_VERSION_MINOR}\"" \
            --export-binaries

      - name: Organize Release Binaries & Checksums
        run: |
          cd ./Firmware/BlueSMiRF-v2/build/esp32.esp32.esp32/
          cp BlueSMiRF-v2.ino.bin "BlueSMiRF_Firmware_${TAG}.bin"
          [ -f BlueSMiRF-v2.ino.bootloader.bin ] && cp BlueSMiRF-v2.ino.bootloader.bin "BlueSMiRF_Bootloader_${TAG}.bin"
          [ -f BlueSMiRF-v2.ino.partitions.bin ] && cp BlueSMiRF-v2.ino.partitions.bin "BlueSMiRF_Partitions_${TAG}.bin"
          sha256sum BlueSMiRF_*.bin > SHA256SUMS.txt
          ls -la

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlueSMiRF-Firmware-${{ env.TAG }}
          path: |
            ./Firmware/BlueSMiRF-v2/build/esp32.esp32.esp32/BlueSMiRF_*.bin
            ./Firmware/BlueSMiRF-v2/build/esp32.esp32.esp32/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "SparkFun BlueSMiRF v2 Firmware ${{ env.TAG }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            ./Firmware/BlueSMiRF-v2/build/esp32.esp32.esp32/BlueSMiRF_*.bin
            ./Firmware/BlueSMiRF-v2/build/esp32.esp32.esp32/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
