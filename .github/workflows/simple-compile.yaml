name: Compile ESP32 Firmware

on:
  push:
    branches:
      - main
      - release_candidate
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository into the runner environment
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Arduino CLI
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # Step 3: Install ESP32 core using explicit CLI commands for reliability
      - name: Install ESP32 Platform
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      # Step 4: Compile the sketch
      - name: Compile ESP32 Sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "esp32:esp32:esp32"
          sketch-paths: |
            ./Firmware
